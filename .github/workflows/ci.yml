name: Build and local tests

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HITHER_TEST_REAL_CODEX: '0'
      HITHER_TEST_REAL_OFFICE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install website build dependencies for artwork tests
        run: npm ci --prefix website --ignore-scripts
      - name: Build and type-check
        run: npm run build
      - name: Run synthetic local tests
        run: npm test
      - name: Prepare the pinned Codex runtime
        run: |
          node scripts/package-codex-runtime.mjs .local/ci-codex
          echo "HITHER_CODEX_BIN=$PWD/.local/ci-codex/bin/codex" >> "$GITHUB_ENV"
      - name: Enable the verified Linux sandbox helper on restricted Ubuntu runners
        if: runner.os == 'Linux'
        run: bash .github/scripts/ci-bwrap-profile.sh .local/ci-codex
      - name: Validate the pinned CLI against local protocol and permission fixtures
        env:
          HITHER_TEST_REAL_CODEX: '1'
        run: node --test tests/codex.test.mjs tests/codex-extraction-runtime.test.mjs tests/codex-runtime-integration.test.mjs
      - name: Validate website finance examples and presentation
        run: node --test website/*.test.mjs
